# supply-360: the only container on the publicweb network. Traefik (or the NGINX that manages publicweb) terminates
# TLS and forwards plain HTTP here on port 80. This proxy routes by path over the private `supply` network:
#   /api/...  -> api:4000   (JSON API, SampTrek webhooks and S2S callbacks, respondent links /api/v1/i and /api/v1/r)
#   anything else -> web:3000 (Next.js app)
# No port is published from any container; port 80 is reachable only from containers on publicweb.

server_tokens off;

# Docker's embedded DNS. Resolving per request (via variables) lets this proxy start, and recover, while api or web
# are still starting or being replaced.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme the client used. Traefik sends X-Forwarded-Proto: https; the web app uses it for HSTS and CSP.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
  default $http_x_forwarded_host;
  ''      $host;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

log_format supply escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method","uri":"$uri",'
  '"upstream":"$upstream_addr","request_time":$request_time,"bytes":$body_bytes_sent,"correlation_id":"$sent_http_x_correlation_id"}';

server {
  listen 80;
  server_name _;
  access_log /dev/stdout supply;
  error_log /dev/stderr warn;

  # The API takes JSON bodies up to 256 KB; leave headroom for headers and webhooks.
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $forwarded_host;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # Liveness of the proxy itself, for its own healthcheck.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Prometheus scrapes the API directly on the supply network; never expose metrics to the public side.
  location = /api/v1/metrics {
    return 404;
  }

  location /api/ {
    set $api http://api:4000;
    proxy_pass $api;
  }

  location / {
    set $web http://web:3000;
    proxy_pass $web;
  }
}
