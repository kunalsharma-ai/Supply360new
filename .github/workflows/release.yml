name: Release images
# Builds and pushes the API and web images for a version tag. It never deploys: a person runs the deployment
# runbook (docs/runbooks/deployment.md) with an approved change, pointing at the image digests this job prints.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: S360_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/supply360-${{ matrix.app }}:${{ github.ref_name }}
      - name: Digest for the change record
        run: echo "supply360-${{ matrix.app }} ${{ github.ref_name }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
