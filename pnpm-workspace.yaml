packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  argon2: true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.10'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
  - '@nestjs/common@12.6.2'
  - '@nestjs/core@12.6.2'
  - '@nestjs/platform-express@12.6.2'
  - '@nestjs/testing@12.6.2'
  - '@types/react@19.3.3'
  - lucide-react@1.80.0
overrides:
  uuid@<11.1.1: 11.1.1
  '@esbuild-kit/core-utils>esbuild': 0.28.2
